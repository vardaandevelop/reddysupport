services:
  postgres-test:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: support_test, POSTGRES_USER: support_user, POSTGRES_PASSWORD: test_password }
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U support_user -d support_test"], interval: 2s, timeout: 3s, retries: 20 }
